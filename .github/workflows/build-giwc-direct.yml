name: Build GIWC APK (direct source)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'GIWC-Android/**'
      - '.github/workflows/build-giwc-direct.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --verbose --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: GIWC-Android
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GIWC-APK
          path: GIWC-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
